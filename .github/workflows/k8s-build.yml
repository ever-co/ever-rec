name: k8s-build
# Images for Ever's own Rec deployment on ever-k8s (ArgoCD apps ever-rec-<env> in ever-co/k8s-gitops).
# The in-cluster builder (ci-builds) runs this file on every push to develop, stage and main; Argo CD Image
# Updater then rolls the new digest out. It reads GitHub Variables but never secret values, so nothing
# below may need a secret: every NEXT_PUBLIC_* value is public (it ships in the browser bundle), and the
# API gets its Firebase and other credentials at run time from OpenBao, not at build time.
on:
  workflow_dispatch:
  push:
    branches: [develop, stage, main]
concurrency:
  group: k8s-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ever-rec-api
            dockerfile: .deploy/api/Dockerfile
          - image: ever-rec-portal
            dockerfile: .deploy/portal/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # One host pair per environment. The portal bakes these into its bundle (NEXT_PUBLIC_* is inlined
      # at build time), so a portal image only works against the API host it was built for, and every tag
      # below names its environment (stage and main can build the same commit with different hosts).
      - id: t
        run: |
          case "${GITHUB_REF_NAME}" in
            develop) echo "tag=dev" >> "$GITHUB_OUTPUT"; echo "api=https://apidev.rec.so" >> "$GITHUB_OUTPUT"; echo "web=https://appdev.rec.so" >> "$GITHUB_OUTPUT"; echo "apps=platform=https://app-dev.ever.co,works=https://app-dev.ever.works,teams=https://demo.ever.team,gauzy=https://demo.gauzy.co,demand=https://app.everdemand.co,rec=https://app.rec.so,traduora=https://demo.traduora.co,tech=https://ever.tech" >> "$GITHUB_OUTPUT" ;;
            stage) echo "tag=stage" >> "$GITHUB_OUTPUT"; echo "api=https://apistage.rec.so" >> "$GITHUB_OUTPUT"; echo "web=https://appstage.rec.so" >> "$GITHUB_OUTPUT"; echo "apps=platform=https://app-stage.ever.co,works=https://app-stage.ever.works,teams=https://stage.ever.team,gauzy=https://stage.gauzy.co,demand=https://app.everdemand.co,rec=https://app.rec.so,traduora=https://app.traduora.co,tech=https://ever.tech" >> "$GITHUB_OUTPUT" ;;
            main) echo "tag=prod" >> "$GITHUB_OUTPUT"; echo "api=https://api.rec.so" >> "$GITHUB_OUTPUT"; echo "web=https://app.rec.so" >> "$GITHUB_OUTPUT"; echo "apps=platform=https://app.ever.co,works=https://app.ever.works,teams=https://app.ever.team,gauzy=https://app.gauzy.co,demand=https://app.everdemand.co,rec=https://app.rec.so,traduora=https://app.traduora.co,tech=https://ever.tech" >> "$GITHUB_OUTPUT" ;;
            # Any other ref (a manual run on a feature branch) stops here: it must never publish an environment tag.
            *) echo "::error::k8s-build publishes only develop, stage and main (got ${GITHUB_REF_NAME})"; exit 1 ;;
          esac
      # Keep comments ABOVE `build-args:`: a `#` line inside the block scalar becomes a malformed build-arg.
      # The API ignores these args (its Dockerfile declares only the FIREBASE_* ones, left empty here).
      # Static files come from the API host (apps/api serves public/), as the Dockerfile default says.
      # NEXT_PUBLIC_EXTENSION_NAME and _ID keep the Dockerfile defaults (Rec, the Chrome Web Store id).
      # NEXT_PUBLIC_EVER_APP_LINKS: the Ever app switcher's links, each environment's own app hosts (a product
      # with no host in an environment links to its production host: homelab
      # docs/handoffs/HANDOVER-2026-11-26-ever-app-switcher-in-apps.md §1 and §3.2).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ steps.t.outputs.api }}
            NEXT_PUBLIC_STATIC_FILES_URL=${{ steps.t.outputs.api }}
            NEXT_PUBLIC_WEBSITE_URL=${{ steps.t.outputs.web }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_EVER_CONNECT_ENABLED=${{ vars.NEXT_PUBLIC_EVER_CONNECT_ENABLED }}
            NEXT_PUBLIC_EVER_APP_LINKS=${{ steps.t.outputs.apps }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.t.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.t.outputs.tag }}-sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=min
